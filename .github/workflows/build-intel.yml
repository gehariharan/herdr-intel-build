name: Build Herdr for Intel Mac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: herdrdev/herdr-app
          ref: 4aa3460749947e7771aa39a8a2cec58d46649926
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Build source release
        run: |
          test "$(uname -m)" = x86_64
          cargo build --release --locked
          file target/release/herdr-app
          target/release/herdr-app --help
      - name: Bundle source build
        shell: bash
        run: |
          mkdir -p dist/Herdr.app/Contents/{MacOS,Resources}
          cp target/release/herdr-app dist/Herdr.app/Contents/MacOS/Herdr
          cp assets/icons/Herdr.icns LICENSE THIRD-PARTY-NOTICES dist/Herdr.app/Contents/Resources/
          python3 - <<'PY'
          import pathlib, plistlib
          info = {
            'CFBundleExecutable': 'Herdr',
            'CFBundleIdentifier': 'dev.herdr.app',
            'CFBundleName': 'Herdr',
            'CFBundleDisplayName': 'Herdr',
            'CFBundleIconFile': 'Herdr',
            'CFBundlePackageType': 'APPL',
            'CFBundleShortVersionString': '0.1.12',
            'CFBundleVersion': '0.1.12',
            'LSMinimumSystemVersion': '15.0',
            'NSPrincipalClass': 'NSApplication',
            'NSHighResolutionCapable': True,
            'NSMicrophoneUsageDescription': 'Terminal programs running in Herdr can use the microphone.',
            'NSCameraUsageDescription': 'Terminal programs running in Herdr can use the camera.',
            'NSAppleEventsUsageDescription': 'Terminal programs running in Herdr can use AppleScript to control other apps.'
          }
          with pathlib.Path('dist/Herdr.app/Contents/Info.plist').open('wb') as f:
              plistlib.dump(info, f)
          PY
          codesign --force --sign - dist/Herdr.app
          codesign --verify --strict dist/Herdr.app
          tar -czf dist/herdr-app-macos-x86_64.tar.gz -C dist Herdr.app
          (cd dist && shasum -a 256 herdr-app-macos-x86_64.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: herdr-app-macos-x86_64
          path: |
            dist/herdr-app-macos-x86_64.tar.gz
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: herdr-app-macos-x86_64
          path: dist
      - name: Publish community source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "herdr-v0.1.12-build-${GITHUB_RUN_NUMBER}" \
            dist/herdr-app-macos-x86_64.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Herdr 0.1.12 for Intel Mac (build ${GITHUB_RUN_NUMBER})" \
            --notes 'Unofficial community source build of herdrdev/herdr-app v0.1.12 (4aa3460749947e7771aa39a8a2cec58d46649926) for Intel Macs running macOS 15 or newer. Built on a GitHub-hosted Intel macOS runner. Ad-hoc signed; not Apple notarized. Source builds do not auto-update. Download and extract the tar.gz, then move Herdr.app into ~/Applications. Herdr also needs herdr-core, which the app can help install. Upstream source and license: https://github.com/herdrdev/herdr-app/tree/4aa3460749947e7771aa39a8a2cec58d46649926 .'
